<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ContentEngine">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Multi-mode AI Content Production">
  <title>Content Engine</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      font-family: 'IBM Plex Mono', monospace;
      background: #000;
      color: #fff;
      width: 100%;
      height: 100%;
    }
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600&display=swap');
    
    body {
      overflow-y: auto;
      padding: 20px;
    }
    
    .title-main {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.5rem;
      letter-spacing: 0.1em;
      color: #00FF85;
      margin-bottom: 12px;
      margin-top: 80px;
      text-align: center;
      line-height: 1.2;
    }
    
    .subtitle {
      color: #888;
      margin-bottom: 15px;
      font-size: 0.9rem;
      text-align: center;
    }
    
    .api-section {
      background: rgba(255, 215, 0, 0.1);
      border: 2px solid #FFD700;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }
    
    .api-label {
      color: #FFD700;
      font-weight: 600;
      margin-bottom: 10px;
    }
    
    .api-input {
      width: 100%;
      background: #111;
      border: 1px solid #333;
      color: #fff;
      padding: 12px;
      border-radius: 4px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.9rem;
    }
    
    .api-note {
      font-size: 0.8rem;
      color: #999;
      margin-top: 10px;
    }
    
    .modes-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 30px;
    }
    
    .mode-card {
      border: 2px solid;
      border-radius: 8px;
      padding: 20px;
      cursor: pointer;
      transition: all 0.3s ease;
      min-height: 150px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    
    .mode-card:active {
      transform: scale(0.98);
    }
    
    .mode-name {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 8px;
    }
    
    .mode-desc {
      font-size: 0.85rem;
      opacity: 0.7;
    }
    
    .buildermotion {
      border-color: #00FF85;
      color: #00FF85;
    }
    
    .lumik {
      border-color: #0052CC;
      color: #0052CC;
    }
    
    .formation {
      border-color: #FF6B9D;
      color: #FF6B9D;
    }
    
    .veille {
      border-color: #9D4EDD;
      color: #9D4EDD;
    }
    
    .modes-container {
      display: block;
    }
    
    .modes-container.hidden {
      display: none;
    }
    
    .chat-section {
      display: none;
      flex-direction: column;
      gap: 15px;
      margin-top: 20px;
    }
    
    .chat-section.active {
      display: flex !important;
    }
    
    .messages-box {
      background: #111;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 15px;
      height: 300px;
      overflow-y: auto;
      font-size: 0.9rem;
    }
    
    .message {
      margin-bottom: 12px;
      padding: 10px;
      background: #1a1a1a;
      border-radius: 4px;
    }
    
    .message.user {
      background: #00FF8520;
      text-align: right;
    }
    
    .message.assistant {
      background: #0052CC20;
    }
    
    .input-group {
      display: flex;
      gap: 10px;
    }
    
    .input-group input {
      flex: 1;
      background: #111;
      border: 1px solid #333;
      color: #fff;
      padding: 10px;
      border-radius: 4px;
      font-family: 'IBM Plex Mono', monospace;
    }
    
    .input-group button {
      background: #00FF85;
      color: #000;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
    }
    
    .input-group button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .back-btn {
      background: #333;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="modes-container" id="modesContainer">
    <h1 class="title-main">CONTENT<br>ENGINE</h1>
    <p class="subtitle">Multi-mode AI Production</p>
    
    <div class="api-section">
      <div class="api-label">CLAUDE API KEY</div>
      <input type="password" id="apiKey" class="api-input" placeholder="sk-ant-...">
      <div class="api-note">Clé requise. Non stockée.</div>
    </div>
    
    <div class="modes-grid">
      <div class="mode-card buildermotion" onclick="selectMode('buildermotion')">
        <div class="mode-name">BuilderMotion</div>
        <div class="mode-desc">Script génération<br>TikTok hooks</div>
      </div>
      <div class="mode-card lumik" onclick="selectMode('lumik')">
        <div class="mode-name">LUMIK</div>
        <div class="mode-desc">Stratégie e-<br>commerce</div>
      </div>
      <div class="mode-card formation" onclick="selectMode('formation')">
        <div class="mode-name">Formation</div>
        <div class="mode-desc">Contenu éducatif IA<br>& Marketing</div>
      </div>
      <div class="mode-card veille" onclick="selectMode('veille')">
        <div class="mode-name">Veille IA</div>
        <div class="mode-desc">Intelligence veille<br>technologique</div>
      </div>
    </div>
  </div>
  
  <div id="chatSection" class="chat-section">
    <button class="back-btn" onclick="backToModes()">← Retour</button>
    <div class="messages-box" id="messagesBox"></div>
    <div class="input-group">
      <input type="text" id="userInput" placeholder="Tape ton message...">
      <button id="sendBtn" onclick="sendMessage()">✈️</button>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      const swCode = `const CACHE_NAME = 'content-engine-v1';const urlsToCache = ['/'];self.addEventListener('install', event => {event.waitUntil(caches.open(CACHE_NAME).then(cache => cache.addAll(urlsToCache)).then(() => self.skipWaiting()));});self.addEventListener('activate', event => {event.waitUntil(caches.keys().then(cacheNames => {return Promise.all(cacheNames.map(cacheName => {if (cacheName !== CACHE_NAME) {return caches.delete(cacheName);}}));}).then(() => self.clients.claim()));});self.addEventListener('fetch', event => {if (event.request.url.includes('api.anthropic.com')) {return;}event.respondWith(caches.match(event.request).then(response => {if (response) return response;return fetch(event.request).then(response => {if (!response || response.status !== 200 || response.type === 'error') {return response;}const responseToCache = response.clone();caches.open(CACHE_NAME).then(cache => {cache.put(event.request, responseToCache);});return response;});}).catch(() => {return new Response('Offline');}));});`;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      const swUrl = URL.createObjectURL(blob);
      navigator.serviceWorker.register(swUrl).catch(() => {});
    }

    const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
    const manifestUrl = URL.createObjectURL(manifestBlob);
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = manifestUrl;
    document.head.appendChild(link);

    let currentMode = null;
    let messages = [];
    const systemPrompts = {
      buildermotion: "Tu es un expert en création de contenu TikTok. Crée des hooks accrocheurs en 0-3s, développement 3-10s, CTA final.​​​​​​​​​​​​​​​​
